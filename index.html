<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeNexus 3D — The Web of Prime Relations & Discovery Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-black relative overflow-x-hidden">
  
  <!-- 3D Three.js WebGL Cosmic Background -->
  <div id="webgl-3d-bg" class="fixed inset-0 pointer-events-none z-0"></div>

  <div id="app" class="flex flex-col min-h-screen relative z-10">
    
    <!-- Top Header & Global Status -->
    <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-50 shadow-2xl">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/25 text-white font-black text-xl border border-cyan-400/30">
            ℘
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-outfit font-black text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-300">
                PrimeNexus 3D
              </h1>
              <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-bold">
                Relations → Discovery
              </span>
            </div>
            <p class="text-xs text-slate-400 font-mono hidden sm:block">Connecting the Secret Patterns of Primes</p>
          </div>
        </div>

        <!-- Global Telemetry Badges -->
        <div class="flex items-center gap-2 sm:gap-4">
          <!-- Background Worker Status Indicator -->
          <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-700/60 px-3 py-1.5 rounded-lg shadow-inner">
            <span id="worker-pulse" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <div class="text-xs font-mono">
              <span class="text-slate-400 hidden sm:inline">Engine:</span>
              <span id="global-worker-status" class="text-emerald-400 font-semibold">Active</span>
            </div>
          </div>

          <!-- Total Speed -->
          <div class="hidden md:flex items-center gap-1.5 bg-slate-900/90 border border-slate-700/60 px-3 py-1.5 rounded-lg text-xs font-mono">
            <span class="text-slate-400">Rate:</span>
            <span id="global-rate" class="text-cyan-400 font-bold">0</span>
            <span class="text-slate-500 text-[10px]">ops/s</span>
          </div>

          <!-- Discovered Count -->
          <div class="flex items-center gap-1.5 bg-slate-900/90 border border-slate-700/60 px-3 py-1.5 rounded-lg text-xs font-mono">
            <span class="text-amber-400 font-bold">★</span>
            <span id="global-primes-found" class="text-amber-300 font-bold">0</span>
            <span class="text-slate-400 hidden sm:inline">relations</span>
          </div>

          <!-- Sound Toggle -->
          <button id="btn-toggle-sound" class="p-2 rounded-lg bg-slate-900/90 hover:bg-slate-800 border border-slate-700/60 text-slate-300 hover:text-white transition" title="Toggle Discovery Audio Chimes">
            <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            <svg id="icon-sound-off" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-1 sm:space-x-3 border-t border-slate-800/50 overflow-x-auto no-scrollbar">
        <button data-tab="tab-nexus" class="nav-tab active">
          <span class="mr-1.5">🌐</span> 3D Relation Nexus
        </button>
        <button data-tab="tab-relations" class="nav-tab">
          <span class="mr-1.5">🔗</span> The 6 Relations
        </button>
        <button data-tab="tab-hunter-rel" class="nav-tab">
          <span class="mr-1.5">🎯</span> Relational Hunter
        </button>
        <button data-tab="tab-hunter" class="nav-tab">
          <span class="mr-1.5">⚡</span> Live Background Miner
        </button>
        <button data-tab="tab-story" class="nav-tab">
          <span class="mr-1.5">📖</span> Human Story Guide
        </button>
      </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
      
      <!-- TAB 1: 3D RELATION NEXUS (ACTIVE DEFAULT) -->
      <section id="tab-nexus" class="tab-panel active">
        <!-- Populated by relationNexus3D.js -->
      </section>

      <!-- TAB 2: THE 6 FUNDAMENTAL RELATIONS -->
      <section id="tab-relations" class="tab-panel hidden">
        <!-- Populated by relationsExplorer.js -->
      </section>

      <!-- TAB 3: RELATIONSHIP-DRIVEN HUNTER -->
      <section id="tab-hunter-rel" class="tab-panel hidden">
        <!-- Populated by relationHunter.js -->
      </section>

      <!-- TAB 4: LIVE BACKGROUND MINER -->
      <section id="tab-hunter" class="tab-panel hidden">
        <!-- Populated by hunter.js -->
      </section>

      <!-- TAB 5: STORY GUIDE -->
      <section id="tab-story" class="tab-panel hidden">
        <!-- Populated by storyRelations.js -->
      </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/60 bg-slate-950/80 backdrop-blur text-xs text-slate-500 py-4 font-mono">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2">
        <div>
          <span>PrimeNexus 3D Engine</span> • Three.js WebGL & Multithreaded Relational BigInt Architecture
        </div>
        <div class="flex items-center gap-4">
          <span>From Relationships to Discoveries</span>
          <span class="text-cyan-400">Running Live</span>
        </div>
      </div>
    </footer>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
